<html>
<head>

</head>
<body>

<div class="header">
    <h2>Employee Management System</h2>
</div>

<div class="navbar">

    <a href="/add">Add Employee</a>
    <a href="/view">View Employees</a>

<div class="container">
    <h1>Add Employee</h1>

    <form method="POST">

        <input type="email" name="email" placeholder="Email" required><br><br>

        <button type="submit">Add Employee</button>

    </form>

</div>
